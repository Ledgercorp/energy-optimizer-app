name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site from an explicit allowlist
        run: |
          sudo apt-get install -y -qq librsvg2-bin > /dev/null
          mkdir _site
          cp index.html styles.css app.js core.js thermostat.js sw.js manifest.webmanifest icon.svg _site/
          touch _site/.nojekyll
          # Home Screen icons need full-bleed PNGs (iOS rounds the corners itself).
          sed 's/rx="112"/rx="0"/' icon.svg > full.svg
          for s in 180 192 512; do rsvg-convert -w $s -h $s full.svg -o _site/icon-$s.png; done
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
