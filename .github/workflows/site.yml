name: site
# Hourly: collect public Wilmington weather, commit it, redeploy GitHub Pages.
# On code pushes: just redeploy. Public repo => Actions minutes are free.
# The aeo-operator Worker dispatches this when the hourly schedule is missed, and to deliver validated insights.
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      backfill_from:
        description: 'Optional YYYY-MM-DD: backfill station history from this date'
        required: false
        default: ''
      insights:
        description: 'Operator insights JSON from the aeo-operator Worker (validated again before publishing)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: site, cancel-in-progress: false }

defaults:
  run:
    shell: bash

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect weather (public city-level data only)
        env:
          BACKFILL: ${{ inputs.backfill_from }}
          INSIGHTS: ${{ inputs.insights }}
        run: node collector/collect.mjs "$BACKFILL"
      - name: Commit data
        run: |
          git config user.name 'weather-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weather
          git diff --cached --quiet && exit 0
          git commit -qm "weather: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1

  deploy:
    needs: collect
    if: ${{ !cancelled() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Build site from an explicit allowlist
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin > /dev/null
          mkdir _site
          cp index.html styles.css app.js core.js weather.js advisor.js thermostat.js sw.js manifest.webmanifest icon.svg _site/
          if [ -d data/weather ]; then mkdir -p _site/data && cp -r data/weather _site/data/; fi
          touch _site/.nojekyll
          # Home Screen icons need full-bleed PNGs (iOS rounds the corners itself).
          sed 's/rx="112"/rx="0"/' icon.svg > full.svg
          for s in 180 192 512; do rsvg-convert -w $s -h $s full.svg -o _site/icon-$s.png; done
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
