<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Privacy: the page may only contact itself and the two free weather APIs. Usage data never leaves the browser. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.weather.gov https://archive-api.open-meteo.com; img-src 'self' data:; style-src 'self'; script-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0c1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Energy">
<meta name="description" content="Private, recommendation-only thermostat and electricity dashboard.">
<title>Apartment Energy Optimizer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- PNG icons are rendered from icon.svg by the GitHub Pages build -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Sections"></nav>
  <main id="view" class="view" tabindex="-1"><p class="muted">Loading…</p></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="pad">This app needs JavaScript. Nothing is sent anywhere; it runs entirely in your browser.</p></noscript>
</body>
</html>
